<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPS Tracker Viewer</title>

  <!-- Leaflet CSS (dengan fallback) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';"
  />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: 100vh;
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
      background: #1e293b;
      border-right: 1px solid #334155;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar h1 {
      font-size: 18px;
      font-weight: 600;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar h1::before {
      content: "📍";
      font-size: 20px;
    }

    .upload-box {
      border: 2px dashed #475569;
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #0f172a;
    }

    .upload-box:hover {
      border-color: #3b82f6;
      background: #1e3a8a20;
    }

    .upload-box.dragover {
      border-color: #3b82f6;
      background: #1e3a8a40;
    }

    .upload-box p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 8px;
    }

    .upload-box .icon {
      font-size: 28px;
    }

    #fileInput { display: none; }

    .stats {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .stats.visible { display: flex; }

    .stat-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px 14px;
    }

    .stat-card .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .stat-card .value .unit {
      font-size: 12px;
      font-weight: 400;
      color: #94a3b8;
      margin-left: 4px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* ---------- Playback ---------- */
    .playback {
      display: none;
      flex-direction: column;
      gap: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 14px;
    }

    .playback.visible { display: flex; }

    .playback h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
    }

    .controls {
      display: flex;
      gap: 6px;
    }

    .controls button {
      flex: 1;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
    }

    .controls button:hover { background: #334155; }
    .controls button.primary { background: #3b82f6; border-color: #3b82f6; }
    .controls button.primary:hover { background: #2563eb; }

    .slider {
      width: 100%;
      cursor: pointer;
    }

    .current-point {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .info-message {
      background: #1e3a8a30;
      border: 1px solid #1e40af;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
      color: #93c5fd;
      line-height: 1.5;
    }

    /* ---------- Map ---------- */
    #map {
      width: 100%;
      height: 100vh;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0f172a;
      color: #64748b;
      font-size: 14px;
      flex-direction: column;
      gap: 8px;
    }

    .empty-state .icon { font-size: 48px; opacity: 0.4; }

    /* custom marker for current playback position */
    .playback-marker {
      background: #ef4444;
      width: 18px !important;
      height: 18px !important;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* ---------- Storage & History ---------- */
    .storage-section {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .storage-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
    }
    .storage-status { font-size: 12px; color: #94a3b8; }
    .storage-status.ok { color: #86efac; }
    .btn-setup-folder {
      background: #3b82f6; color: white; border: none;
      border-radius: 4px; padding: 8px; cursor: pointer;
      font-size: 13px; transition: background 0.15s;
    }
    .btn-setup-folder:hover { background: #2563eb; }
    .btn-setup-folder:disabled { opacity: 0.4; cursor: not-allowed; }
    .history-section { display: flex; flex-direction: column; gap: 8px; }
    .history-section h3 {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.5px; color: #64748b;
    }
    .history-list {
      display: flex; flex-direction: column; gap: 5px;
      max-height: 200px; overflow-y: auto;
    }
    .history-item {
      background: #0f172a; border: 1px solid #334155;
      border-radius: 4px; padding: 8px 10px; font-size: 12px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .hi-header { display: flex; align-items: center; gap: 6px; }
    .hi-name-text {
      flex: 1; color: #f1f5f9; font-weight: 500; cursor: pointer;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      transition: color 0.15s;
    }
    .hi-name-text:hover { color: #f97316; }
    .hi-actions { display: flex; gap: 3px; flex-shrink: 0; }
    .hi-btn {
      background: transparent; border: none; color: #64748b;
      cursor: pointer; padding: 2px 5px; border-radius: 3px;
      font-size: 13px; transition: all 0.15s; line-height: 1;
    }
    .hi-btn:hover { color: #f1f5f9; background: #1e293b; }
    .hi-btn.del:hover { color: #ef4444; }
    .hi-rename-input {
      flex: 1; background: #1e293b; border: 1px solid #3b82f6;
      color: #f1f5f9; padding: 3px 7px; border-radius: 3px;
      font-size: 12px; outline: none; min-width: 0;
    }
    .history-item .hi-meta { color: #64748b; font-size: 10px; }
    .btn-save-route {
      background: #16a34a; color: white; border: none;
      border-radius: 4px; padding: 10px; cursor: pointer;
      font-size: 13px; font-weight: 500; width: 100%;
      transition: background 0.15s; display: none;
    }
    .btn-save-route:hover { background: #15803d; }

    /* ---------- Speed legend ---------- */
    .speed-legend {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .speed-legend .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
    }
    .legend-swatches { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
    .leg-sw {
      font-size: 10px; color: white; padding: 3px 7px;
      border-radius: 3px; font-weight: 600; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h1>GPS Tracker Viewer</h1>

      <label class="upload-box" id="uploadBox">
        <div class="icon">📂</div>
        <p><strong>Klik atau drop file</strong></p>
        <p>Mendukung .gpx dan .kml</p>
        <input type="file" id="fileInput" accept=".gpx,.kml" />
      </label>

      <!-- Storage section -->
      <div class="storage-section">
        <h3>Penyimpanan Lokal</h3>
        <div class="storage-status" id="storageStatus">Folder belum dipilih</div>
        <button class="btn-setup-folder" id="btnSetupFolder">📁 Pilih Folder</button>
      </div>

      <div id="infoMessage" class="info-message" style="display:none;"></div>

      <div class="stats" id="stats">
        <div class="stat-card">
          <div class="label">Nama Track</div>
          <div class="value" id="trackName">-</div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="label">Total Titik</div>
            <div class="value" id="totalPoints">-</div>
          </div>
          <div class="stat-card">
            <div class="label">Jarak</div>
            <div class="value" id="distance">-<span class="unit">km</span></div>
          </div>
          <div class="stat-card">
            <div class="label">Durasi</div>
            <div class="value" id="duration">-</div>
          </div>
          <div class="stat-card">
            <div class="label">Kec. Maks</div>
            <div class="value" id="maxSpeed">-<span class="unit">km/h</span></div>
          </div>
          <div class="stat-card">
            <div class="label">Kec. Rata2</div>
            <div class="value" id="avgSpeed">-<span class="unit">km/h</span></div>
          </div>
          <div class="stat-card">
            <div class="label">Elevasi</div>
            <div class="value" id="elevation">-<span class="unit">m</span></div>
          </div>
        </div>

        <div class="stat-card">
          <div class="label">Mulai</div>
          <div class="value" id="startTime" style="font-size:13px;">-</div>
        </div>
        <div class="stat-card">
          <div class="label">Selesai</div>
          <div class="value" id="endTime" style="font-size:13px;">-</div>
        </div>
      </div>

      <div class="playback" id="playback">
        <h3>▶ Playback</h3>
        <div class="controls">
          <button id="btnPlay" class="primary">Play</button>
          <button id="btnReset">Reset</button>
        </div>
        <input type="range" id="slider" class="slider" min="0" max="100" value="0" />
        <div class="current-point">
          <span id="currentIdx">Titik 0 / 0</span>
          <span id="currentSpeed">- km/h</span>
        </div>
        <div class="current-point">
          <span id="currentTime">-</span>
        </div>
      </div>
      <!-- Speed legend -->
      <div class="speed-legend" id="speedLegend" style="display:none;">
        <div class="label">Warna Kecepatan</div>
        <div class="legend-swatches">
          <span class="leg-sw" style="background:#ef4444">Berhenti</span>
          <span class="leg-sw" style="background:#f97316">&lt;10</span>
          <span class="leg-sw" style="background:#f59e0b">&lt;20</span>
          <span class="leg-sw" style="background:#84cc16">&lt;35</span>
          <span class="leg-sw" style="background:#22c55e">35+</span>
          <span style="font-size:10px;color:#64748b;margin-left:2px;">km/h</span>
        </div>
      </div>

      <button class="btn-save-route" id="btnSaveRoute">💾 Simpan Route ke Folder</button>

      <!-- History -->
      <div class="history-section" id="historySection" style="display:none;">
        <h3>Riwayat Track</h3>
        <div class="history-list" id="historyList"></div>
      </div>
    </aside>

    <!-- Map -->
    <div id="map"></div>
  </div>

  <!-- Leaflet JS dengan fallback CDN -->
  <script>
    // Loader Leaflet dengan fallback antar CDN
    function loadLeaflet() {
      return new Promise((resolve, reject) => {
        const sources = [
          'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',
          'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
          'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'
        ];

        let i = 0;
        function tryLoad() {
          if (i >= sources.length) {
            reject(new Error('Semua CDN Leaflet gagal di-load. Cek koneksi internet atau firewall.'));
            return;
          }
          const s = document.createElement('script');
          s.src = sources[i];
          s.onload = () => {
            if (typeof L !== 'undefined') {
              console.log('Leaflet loaded from:', sources[i]);
              resolve();
            } else {
              i++;
              tryLoad();
            }
          };
          s.onerror = () => {
            console.warn('Gagal load dari:', sources[i]);
            i++;
            tryLoad();
          };
          document.head.appendChild(s);
        }
        tryLoad();
      });
    }

    // Jalankan semua kode utama setelah Leaflet siap
    loadLeaflet()
      .then(() => initApp())
      .catch(err => {
        document.getElementById('map').innerHTML =
          '<div style="padding:40px;text-align:center;color:#fca5a5;">' +
          '<h2>❌ Gagal memuat Leaflet</h2>' +
          '<p style="margin-top:12px;">' + err.message + '</p>' +
          '<p style="margin-top:8px;font-size:13px;color:#94a3b8;">' +
          'Pastikan koneksi internet aktif. Jika di belakang firewall perusahaan, ' +
          'minta admin untuk allowlist: cdnjs.cloudflare.com, unpkg.com, atau cdn.jsdelivr.net' +
          '</p></div>';
      });

    function initApp() {
    // ============================================================
    // Map initialization
    // ============================================================
    const map = L.map('map').setView([-6.2, 106.9], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    let trackLayer = null;
    let startMarker = null;
    let endMarker = null;
    let playbackMarker = null;
    let trackPoints = [];
    let dirHandle = null;
    let historicalLayers = [];
    let historicalData = [];
    let currentTrackForSave = null;

    // ============================================================
    // File handling
    // ============================================================
    const fileInput = document.getElementById('fileInput');
    const uploadBox = document.getElementById('uploadBox');

    fileInput.addEventListener('change', e => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    uploadBox.addEventListener('dragover', e => {
      e.preventDefault();
      uploadBox.classList.add('dragover');
    });
    uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('dragover'));
    uploadBox.addEventListener('drop', e => {
      e.preventDefault();
      uploadBox.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = ev => {
        const content = ev.target.result;
        const ext = file.name.toLowerCase().split('.').pop();

        try {
          if (ext === 'gpx') parseGPX(content, file.name);
          else if (ext === 'kml') parseKML(content, file.name);
          else throw new Error('Format tidak didukung. Gunakan .gpx atau .kml');
        } catch (err) {
          showInfo('❌ Error: ' + err.message, 'error');
        }
      };
      reader.readAsText(file);
    }

    // ============================================================
    // GPX parser — extracts lat/lon/ele/time/speed per trackpoint
    // ============================================================
    function parseGPX(xmlText, filename) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, 'text/xml');

      const parseError = xml.querySelector('parsererror');
      if (parseError) throw new Error('File GPX tidak valid');

      const trkpts = xml.querySelectorAll('trkpt');
      if (trkpts.length === 0) throw new Error('Tidak ada trackpoint ditemukan');

      const points = [];
      trkpts.forEach(pt => {
        const lat = parseFloat(pt.getAttribute('lat'));
        const lon = parseFloat(pt.getAttribute('lon'));
        const ele = parseFloat(pt.querySelector('ele')?.textContent || '0');
        const time = pt.querySelector('time')?.textContent || null;
        // GPX speed is in m/s, convert to km/h
        const speedMs = parseFloat(pt.querySelector('speed')?.textContent || '0');
        const speed = speedMs * 3.6;

        if (!isNaN(lat) && !isNaN(lon)) {
          points.push({ lat, lon, ele, time, speed });
        }
      });

      const trackName = xml.querySelector('trk > name')?.textContent
        || xml.querySelector('name')?.textContent
        || filename;

      renderTrack(points, trackName, 'GPX');
    }

    // ============================================================
    // KML parser — only coordinates available (no per-point time/speed)
    // ============================================================
    function parseKML(xmlText, filename) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, 'text/xml');

      const parseError = xml.querySelector('parsererror');
      if (parseError) throw new Error('File KML tidak valid');

      const coordsEl = xml.querySelector('LineString > coordinates')
        || xml.querySelector('coordinates');
      if (!coordsEl) throw new Error('Tidak ada koordinat ditemukan dalam KML');

      const raw = coordsEl.textContent.trim();
      const points = raw.split(/\s+/).map(triple => {
        const [lon, lat, ele] = triple.split(',').map(parseFloat);
        return { lat, lon, ele: ele || 0, time: null, speed: 0 };
      }).filter(p => !isNaN(p.lat) && !isNaN(p.lon));

      if (points.length === 0) throw new Error('Tidak ada koordinat valid');

      const trackName = xml.querySelector('Placemark > name')?.textContent
        || xml.querySelector('Document > name')?.textContent
        || filename;

      renderTrack(points, trackName, 'KML');
    }

    // ============================================================
    // Render track on map + compute statistics
    // ============================================================
    function renderTrack(points, name, format) {
      trackPoints = points;

      // Clear previous layers
      if (trackLayer) map.removeLayer(trackLayer);
      if (startMarker) map.removeLayer(startMarker);
      if (endMarker) map.removeLayer(endMarker);
      if (playbackMarker) map.removeLayer(playbackMarker);

      const latlngs = points.map(p => [p.lat, p.lon]);

      // Draw speed-colored polyline
      trackLayer = buildSpeedTrack(points).addTo(map);
      document.getElementById('speedLegend').style.display =
        points.some(p => p.speed > 0) ? 'flex' : 'none';

      // Start/end markers
      startMarker = L.marker(latlngs[0], {
        title: 'Mulai'
      }).addTo(map).bindPopup('🟢 <b>Titik Awal</b>');

      endMarker = L.marker(latlngs[latlngs.length - 1], {
        title: 'Selesai'
      }).addTo(map).bindPopup('🔴 <b>Titik Akhir</b>');

      map.fitBounds(trackLayer.getBounds(), { padding: [40, 40] });

      // Stats
      const stats = computeStats(points);
      document.getElementById('trackName').textContent = name;
      document.getElementById('totalPoints').textContent = points.length;
      document.getElementById('distance').innerHTML =
        stats.distanceKm.toFixed(2) + '<span class="unit">km</span>';
      document.getElementById('duration').textContent = stats.duration;
      document.getElementById('maxSpeed').innerHTML =
        stats.maxSpeed.toFixed(1) + '<span class="unit">km/h</span>';
      document.getElementById('avgSpeed').innerHTML =
        stats.avgSpeed.toFixed(1) + '<span class="unit">km/h</span>';
      document.getElementById('elevation').innerHTML =
        stats.elevGain + '/' + stats.elevLoss + '<span class="unit">m</span>';
      document.getElementById('startTime').textContent = stats.startTime;
      document.getElementById('endTime').textContent = stats.endTime;

      document.getElementById('stats').classList.add('visible');
      document.getElementById('playback').classList.add('visible');

      // Setup playback slider
      const slider = document.getElementById('slider');
      slider.max = points.length - 1;
      slider.value = 0;
      updatePlaybackMarker(0);

      // Info notice based on format
      if (format === 'KML') {
        showInfo('ℹ️ File KML hanya berisi koordinat. Statistik waktu & kecepatan tidak tersedia. Untuk data lengkap, gunakan file GPX.', 'info');
      } else {
        showInfo('✅ File GPX berhasil dibaca dengan data lengkap (waktu, kecepatan, elevasi).', 'success');
      }
      currentTrackForSave = { points, name, format, stats };
      document.getElementById('btnSaveRoute').style.display = 'block';
    }

    // ============================================================
    // Statistics computation
    // ============================================================
    function computeStats(points) {
      let distanceKm = 0;
      let maxSpeed = 0;
      let sumSpeed = 0;
      let speedCount = 0;
      let elevGain = 0;
      let elevLoss = 0;

      for (let i = 1; i < points.length; i++) {
        distanceKm += haversine(points[i-1], points[i]);

        if (points[i].speed > 0) {
          maxSpeed = Math.max(maxSpeed, points[i].speed);
          sumSpeed += points[i].speed;
          speedCount++;
        }

        const dEle = points[i].ele - points[i-1].ele;
        if (dEle > 0) elevGain += dEle;
        else elevLoss += -dEle;
      }

      const avgSpeed = speedCount > 0 ? sumSpeed / speedCount : 0;

      // Duration
      const firstTime = points[0].time ? new Date(points[0].time) : null;
      const lastTime = points[points.length-1].time ? new Date(points[points.length-1].time) : null;

      let duration = '-';
      let startTime = '-';
      let endTime = '-';

      if (firstTime && lastTime) {
        const diffMs = lastTime - firstTime;
        const mins = Math.floor(diffMs / 60000);
        const secs = Math.floor((diffMs % 60000) / 1000);
        duration = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        startTime = formatTime(firstTime);
        endTime = formatTime(lastTime);
      }

      return {
        distanceKm,
        maxSpeed,
        avgSpeed,
        elevGain: Math.round(elevGain),
        elevLoss: Math.round(elevLoss),
        duration,
        startTime,
        endTime
      };
    }

    // ============================================================
    // Speed-colored track helpers
    // ============================================================
    function getSpeedColor(speed) {
      if (speed <= 0)  return '#ef4444'; // berhenti
      if (speed < 10)  return '#f97316'; // macet berat
      if (speed < 20)  return '#f59e0b'; // macet sedang
      if (speed < 35)  return '#84cc16'; // lancar sedang
      return '#22c55e';                   // lancar
    }

    function buildSpeedTrack(points) {
      const hasSpeed = points.some(p => p.speed > 0);
      if (!hasSpeed) {
        return L.polyline(points.map(p => [p.lat, p.lon]), { color: '#3b82f6', weight: 4, opacity: 0.85 });
      }
      const layers = [];
      let segStart = 0;
      for (let i = 0; i < points.length - 1; i++) {
        const curColor = getSpeedColor(points[i].speed);
        const nextColor = (i + 1 < points.length - 1) ? getSpeedColor(points[i + 1].speed) : null;
        if (nextColor !== curColor) {
          layers.push(L.polyline(
            points.slice(segStart, i + 2).map(p => [p.lat, p.lon]),
            { color: curColor, weight: 5, opacity: 0.9 }
          ));
          segStart = i + 1;
        }
      }
      if (segStart < points.length - 1) {
        layers.push(L.polyline(
          points.slice(segStart).map(p => [p.lat, p.lon]),
          { color: getSpeedColor(points[segStart].speed), weight: 5, opacity: 0.9 }
        ));
      }
      return L.featureGroup(layers);
    }

    function haversine(a, b) {
      const R = 6371; // km
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLon = toRad(b.lon - a.lon);
      const lat1 = toRad(a.lat);
      const lat2 = toRad(b.lat);
      const x = Math.sin(dLat/2) ** 2
        + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon/2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(x));
    }

    function formatTime(d) {
      return d.toLocaleString('id-ID', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    // ============================================================
    // Playback
    // ============================================================
    const slider = document.getElementById('slider');
    const btnPlay = document.getElementById('btnPlay');
    const btnReset = document.getElementById('btnReset');
    let playInterval = null;

    slider.addEventListener('input', e => {
      updatePlaybackMarker(parseInt(e.target.value));
    });

    btnPlay.addEventListener('click', () => {
      if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
        btnPlay.textContent = 'Play';
        return;
      }

      btnPlay.textContent = 'Pause';
      playInterval = setInterval(() => {
        let idx = parseInt(slider.value);
        if (idx >= trackPoints.length - 1) {
          clearInterval(playInterval);
          playInterval = null;
          btnPlay.textContent = 'Play';
          return;
        }
        idx++;
        slider.value = idx;
        updatePlaybackMarker(idx);
      }, 80); // ~12.5 points per second
    });

    btnReset.addEventListener('click', () => {
      if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
        btnPlay.textContent = 'Play';
      }
      slider.value = 0;
      updatePlaybackMarker(0);
    });

    function updatePlaybackMarker(idx) {
      if (!trackPoints.length) return;
      const p = trackPoints[idx];

      if (playbackMarker) map.removeLayer(playbackMarker);

      playbackMarker = L.marker([p.lat, p.lon], {
        icon: L.divIcon({
          className: '',
          html: '<div style="font-size:22px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.6));">🏍️</div>',
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        }),
        zIndexOffset: 1000
      }).addTo(map);

      document.getElementById('currentIdx').textContent =
        `Titik ${idx + 1} / ${trackPoints.length}`;
      document.getElementById('currentSpeed').textContent =
        p.speed > 0 ? `${p.speed.toFixed(1)} km/h` : '-';
      document.getElementById('currentTime').textContent =
        p.time ? formatTime(new Date(p.time)) : '-';
    }

    // ============================================================
    // Info banner
    // ============================================================
    function showInfo(message, type) {
      const el = document.getElementById('infoMessage');
      el.textContent = message;
      el.style.display = 'block';
      if (type === 'error') {
        el.style.background = '#7f1d1d30';
        el.style.borderColor = '#dc2626';
        el.style.color = '#fca5a5';
      } else if (type === 'success') {
        el.style.background = '#14532d30';
        el.style.borderColor = '#16a34a';
        el.style.color = '#86efac';
      } else {
        el.style.background = '#1e3a8a30';
        el.style.borderColor = '#1e40af';
        el.style.color = '#93c5fd';
      }
    }

    // ============================================================
    // Storage: IndexedDB handle persistence
    // ============================================================
    function openIDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('bikeTrackerDB', 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore('handles');
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e.target.error);
      });
    }

    async function initStorage() {
      if (!('showDirectoryPicker' in window)) {
        document.getElementById('storageStatus').textContent = 'Perlu Chrome/Edge untuk fitur ini';
        document.getElementById('btnSetupFolder').disabled = true;
        return;
      }
      try {
        const db = await openIDB();
        const handle = await new Promise((res, rej) => {
          const tx = db.transaction('handles', 'readonly');
          const req = tx.objectStore('handles').get('dirHandle');
          req.onsuccess = e => res(e.target.result || null);
          req.onerror = e => rej(e.target.error);
        });
        if (!handle) return;
        dirHandle = handle;
        const perm = await handle.queryPermission({ mode: 'readwrite' });
        const statusEl = document.getElementById('storageStatus');
        if (perm === 'granted') {
          statusEl.textContent = '📂 ' + handle.name;
          statusEl.classList.add('ok');
          await loadHistoricalTracks();
        } else {
          statusEl.textContent = '📂 ' + handle.name + ' (klik untuk izinkan akses)';
        }
      } catch(e) { console.warn('Storage init:', e); }
    }

    document.getElementById('btnSetupFolder').addEventListener('click', async () => {
      if (!('showDirectoryPicker' in window)) return;
      try {
        const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
        const db = await openIDB();
        await new Promise((res, rej) => {
          const tx = db.transaction('handles', 'readwrite');
          tx.objectStore('handles').put(handle, 'dirHandle');
          tx.oncomplete = res;
          tx.onerror = e => rej(e.target.error);
        });
        dirHandle = handle;
        const statusEl = document.getElementById('storageStatus');
        statusEl.textContent = '📂 ' + handle.name;
        statusEl.classList.add('ok');
        await loadHistoricalTracks();
        showInfo('✅ Folder penyimpanan dipilih: ' + handle.name, 'success');
      } catch(e) {
        if (e.name !== 'AbortError') showInfo('❌ Gagal akses folder: ' + e.message, 'error');
      }
    });

    document.getElementById('btnSaveRoute').addEventListener('click', async () => {
      if (!currentTrackForSave) return;
      if (!dirHandle) {
        showInfo('⚠️ Pilih folder penyimpanan dulu (klik 📁 Pilih Folder di atas)', 'info');
        return;
      }
      const btn = document.getElementById('btnSaveRoute');
      btn.disabled = true;
      btn.textContent = '⏳ Menyimpan...';
      const filename = await saveTrackToFile(currentTrackForSave);
      if (filename) {
        showInfo('💾 Route tersimpan: ' + filename, 'success');
        btn.style.display = 'none';
        currentTrackForSave = null;
        await loadHistoricalTracks();
      }
      btn.disabled = false;
      btn.textContent = '💾 Simpan Route ke Folder';
    });

    async function saveTrackToFile({ points, name, format, stats }) {
      if (!dirHandle) return null;
      try {
        const perm = await dirHandle.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') return null;
        const now = new Date();
        const dateStr = now.toISOString().slice(0, 19).replace(/[T:]/g, '-');
        const safeName = name.replace(/[^\w\-]/g, '_').slice(0, 40);
        const filename = 'track_' + dateStr + '_' + safeName + '.json';
        const payload = { name, savedAt: now.toISOString(), sourceFile: name, format, stats, points };
        const fh = await dirHandle.getFileHandle(filename, { create: true });
        const writable = await fh.createWritable();
        await writable.write(JSON.stringify(payload, null, 2));
        await writable.close();
        return filename;
      } catch(e) { console.error('Save error:', e); return null; }
    }

    async function loadHistoricalTracks() {
      if (!dirHandle) return;
      try {
        const perm = await dirHandle.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') return;
        historicalLayers.forEach(l => { try { map.removeLayer(l); } catch(_) {} });
        historicalLayers = [];
        historicalData = [];
        for await (const [fname, fh] of dirHandle.entries()) {
          if (fh.kind !== 'file' || !fname.startsWith('track_') || !fname.endsWith('.json')) continue;
          try {
            const file = await fh.getFile();
            const data = JSON.parse(await file.text());
            if (data.points && data.points.length > 1) {
              historicalData.push({ ...data, filename: fname });
            }
          } catch(_) { console.warn('Skip:', fname); }
        }
        historicalData.sort((a, b) => new Date(b.savedAt) - new Date(a.savedAt));
        historicalData.forEach(td => {
          const group = buildSpeedTrack(td.points);
          group.setStyle({ opacity: 0.4, weight: 3 });
          group.addTo(map);
          group.on('click', () => {
            try { map.fitBounds(group.getBounds(), { padding: [40, 40] }); } catch(_) {}
          });
          historicalLayers.push(group);
        });
        renderHistoryList();
      } catch(e) { console.warn('Load history:', e); }
    }

    function renderHistoryList() {
      const section = document.getElementById('historySection');
      const list = document.getElementById('historyList');
      if (!historicalData.length) { section.style.display = 'none'; return; }
      section.style.display = 'flex';
      list.innerHTML = '';
      historicalData.forEach((td, i) => {
        const item = document.createElement('div');
        item.className = 'history-item';
        const dateStr = new Date(td.savedAt).toLocaleDateString('id-ID', {
          day: '2-digit', month: 'short', year: 'numeric'
        });
        const dist = td.stats && td.stats.distanceKm
          ? td.stats.distanceKm.toFixed(1) + ' km' : '-';

        const header = document.createElement('div');
        header.className = 'hi-header';

        const nameEl = document.createElement('span');
        nameEl.className = 'hi-name-text';
        nameEl.title = 'Klik untuk zoom ke route';
        nameEl.textContent = td.name;
        nameEl.addEventListener('click', () => {
          renderTrack(td.points, td.name, td.format);
          document.getElementById('btnSaveRoute').style.display = 'none';
          currentTrackForSave = null;
          document.querySelector('.sidebar').scrollTop = 0;
        });

        const actions = document.createElement('div');
        actions.className = 'hi-actions';

        const btnRename = document.createElement('button');
        btnRename.className = 'hi-btn';
        btnRename.title = 'Rename';
        btnRename.textContent = '✎';
        btnRename.addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'hi-rename-input';
          input.value = td.name;
          header.replaceChild(input, nameEl);
          input.focus();
          input.select();
          const commit = () => renameHistoryItem(i, input.value);
          input.addEventListener('blur', commit);
          input.addEventListener('keydown', e => {
            if (e.key === 'Enter') input.blur();
            if (e.key === 'Escape') header.replaceChild(nameEl, input);
          });
        });

        const btnDel = document.createElement('button');
        btnDel.className = 'hi-btn del';
        btnDel.title = 'Hapus';
        btnDel.textContent = '🗑';
        btnDel.addEventListener('click', () => deleteHistoryItem(i));

        actions.appendChild(btnRename);
        actions.appendChild(btnDel);
        header.appendChild(nameEl);
        header.appendChild(actions);

        const meta = document.createElement('div');
        meta.className = 'hi-meta';
        meta.textContent = dateStr + ' · ' + dist + ' · ' + td.format;

        item.appendChild(header);
        item.appendChild(meta);
        list.appendChild(item);
      });
    }

    async function deleteHistoryItem(i) {
      if (!confirm('Hapus route "' + historicalData[i].name + '"?')) return;
      try {
        const perm = await dirHandle.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') return;
        if (historicalLayers[i]) { try { map.removeLayer(historicalLayers[i]); } catch(_) {} }
        await dirHandle.removeEntry(historicalData[i].filename);
        historicalLayers.splice(i, 1);
        historicalData.splice(i, 1);
        renderHistoryList();
      } catch(e) { showInfo('❌ Gagal hapus: ' + e.message, 'error'); }
    }

    async function renameHistoryItem(i, newName) {
      newName = newName.trim();
      if (!newName || newName === historicalData[i].name) { renderHistoryList(); return; }
      try {
        const perm = await dirHandle.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') return;
        const fh = await dirHandle.getFileHandle(historicalData[i].filename);
        const data = JSON.parse(await (await fh.getFile()).text());
        data.name = newName;
        const writable = await fh.createWritable();
        await writable.write(JSON.stringify(data, null, 2));
        await writable.close();
        historicalData[i].name = newName;
        renderHistoryList();
      } catch(e) { showInfo('❌ Gagal rename: ' + e.message, 'error'); renderHistoryList(); }
    }

    initStorage();

    } // <-- tutup initApp()
  </script>
</body>
</html>
