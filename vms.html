<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VMS — Vehicle Monitoring System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'">
  <style>
    :root {
      --bg:      #0d0f14;
      --surface: #111318;
      --card:    #1a1d24;
      --border:  #252830;
      --accent:  #4f7af8;
      --accent-h:#3d68e6;
      --danger:  #ef4444;
      --warning: #f59e0b;
      --success: #22c55e;
      --text:    #e8eaf0;
      --muted:   #7b8099;
      --subtle:  #3a3e50;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; overflow: hidden; font-size: 14px; line-height: 1.5;
    }
    #app { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    #sidebar {
      width: 220px; min-width: 220px;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden;
    }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .brand { padding: 20px 16px 16px; border-bottom: 1px solid var(--border); }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
    .brand-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .nav-section {
      padding: 16px 16px 4px;
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--subtle);
    }
    .nav-item {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 16px; cursor: pointer; color: var(--muted);
      font-size: 13.5px; transition: all 0.12s;
      border-left: 2px solid transparent; user-select: none;
    }
    .nav-item:hover { background: rgba(79,122,248,0.06); color: var(--text); }
    .nav-item.active { background: rgba(79,122,248,0.1); color: var(--accent); border-left-color: var(--accent); }
    .nav-item svg { flex-shrink: 0; opacity: 0.7; }
    .nav-item.active svg, .nav-item:hover svg { opacity: 1; }

    /* ── Main ── */
    #main { flex: 1; overflow-y: auto; background: var(--bg); }
    #main::-webkit-scrollbar { width: 6px; }
    #main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Page ── */
    .page { padding: 28px 32px; max-width: 1200px; }
    .page-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;
    }
    .page-title { font-size: 20px; font-weight: 600; }
    .page-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 6px; border: none;
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: all 0.12s; white-space: nowrap; font-family: inherit;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-ghost { background: transparent; color: var(--muted); border: none; }
    .btn-ghost:hover { color: var(--text); background: var(--card); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    thead tr { background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); }
    th {
      padding: 10px 14px; text-align: left;
      font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--muted); white-space: nowrap;
    }
    td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.015); }
    .td-actions { display: flex; gap: 4px; }

    /* ── Badges ── */
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
    }
    .badge-success { background: rgba(34,197,94,0.12); color: var(--success); }
    .badge-warning { background: rgba(245,158,11,0.12); color: var(--warning); }
    .badge-danger  { background: rgba(239,68,68,0.12);  color: var(--danger); }
    .badge-muted   { background: rgba(123,128,153,0.12); color: var(--muted); }
    .badge-accent  { background: rgba(79,122,248,0.12);  color: var(--accent); }

    /* ── Forms ── */
    .form-grid   { display: grid; gap: 14px; }
    .form-grid-2 { grid-template-columns: 1fr 1fr; }
    .form-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .form-group  { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }
    input, select, textarea {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 8px 11px; border-radius: 6px; font-size: 13.5px;
      font-family: inherit; transition: border-color 0.12s; outline: none; width: 100%;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background: var(--card); }
    textarea { resize: vertical; min-height: 72px; }

    /* ── Cards ── */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; }
    .kpi-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
    .kpi-value { font-size: 28px; font-weight: 700; line-height: 1; }
    .kpi-sub   { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

    /* ── Section ── */
    .section-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
    .section-gap { margin-bottom: 28px; }

    /* ── Alert list ── */
    .alert-list { display: flex; flex-direction: column; gap: 8px; }
    .alert-item {
      display: flex; align-items: center; gap: 12px; justify-content: space-between;
      padding: 10px 14px; background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px;
    }
    .alert-item.warn { border-left: 3px solid var(--warning); }
    .alert-item.crit { border-left: 3px solid var(--danger); }
    .alert-info { font-weight: 500; }
    .alert-meta { color: var(--muted); font-size: 12px; }

    /* ── Empty state ── */
    .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
    .empty-state .empty-icon { font-size: 32px; opacity: 0.3; margin-bottom: 8px; }
    .empty-state p { font-size: 13.5px; margin-top: 4px; }

    /* ── Modal ── */
    #modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; backdrop-filter: blur(2px);
    }
    #modal-backdrop.open { display: flex; }
    #modal-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      width: 540px; max-width: 95vw; max-height: 90vh;
      display: flex; flex-direction: column;
      box-shadow: 0 24px 64px rgba(0,0,0,0.55);
    }
    #modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    #modal-title  { font-size: 15px; font-weight: 600; }
    .modal-close  { background: transparent; border: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0 2px; line-height: 1; transition: color 0.12s; }
    .modal-close:hover { color: var(--text); }
    #modal-body   { padding: 20px; overflow-y: auto; flex: 1; }
    #modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }

    /* ── Toast ── */
    #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 2000; }
    .toast { padding: 10px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; animation: slideIn 0.2s ease; max-width: 320px; border-left: 3px solid; }
    .toast-success { background: #0c1f14; border-color: var(--success); color: #86efac; }
    .toast-error   { background: #1f0d0d; border-color: var(--danger);  color: #fca5a5; }
    .toast-info    { background: #0d1430; border-color: var(--accent);   color: #93c5fd; }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ── Upload box ── */
    .upload-box {
      border: 2px dashed var(--border); border-radius: 8px; padding: 24px 16px;
      text-align: center; cursor: pointer; transition: all 0.2s; background: transparent; display: block;
    }
    .upload-box:hover, .upload-box.dragover { border-color: var(--accent); background: rgba(79,122,248,0.04); }
    .upload-box-title { font-size: 13.5px; font-weight: 500; margin-bottom: 4px; }
    .upload-box-sub   { font-size: 12px; color: var(--muted); }

    /* ── Tracking layout ── */
    .tracking-layout { display: flex; height: 100%; overflow: hidden; }
    .tracking-panel {
      width: 320px; min-width: 320px; background: var(--surface); border-right: 1px solid var(--border);
      overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .tracking-panel::-webkit-scrollbar { width: 4px; }
    .tracking-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    #tracking-map { flex: 1; }
    .panel-section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
    .panel-section-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 10px; }
    .stats-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-item .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 2px; }
    .stat-item .stat-value { font-size: 15px; font-weight: 600; }
    .stat-item .stat-unit  { font-size: 11px; color: var(--muted); margin-left: 2px; }
    .slider-input { width: 100%; cursor: pointer; accent-color: var(--accent); }
    .playback-info { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }

    /* ── Speed legend ── */
    .speed-legend { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .speed-swatch { font-size: 10px; color: #fff; padding: 2px 7px; border-radius: 3px; font-weight: 600; }

    /* ── Filter bar ── */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; align-items: center; }
    .filter-bar select, .filter-bar input { max-width: 200px; padding: 7px 10px; }

    /* ── Chart ── */
    .chart-wrap { overflow-x: auto; }
    .chart-bars { display: flex; gap: 2px; align-items: flex-end; height: 160px; padding: 0 4px; }
    .chart-bar-group { display: flex; gap: 2px; align-items: flex-end; }
    .chart-bar { border-radius: 3px 3px 0 0; min-width: 18px; transition: opacity 0.15s; }
    .chart-bar:hover { opacity: 0.8; }
    .chart-labels { display: flex; gap: 2px; margin-top: 6px; }
    .chart-label { font-size: 10px; color: var(--muted); text-align: center; }
    .chart-legend { display: flex; gap: 16px; margin-top: 10px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .legend-dot  { width: 10px; height: 10px; border-radius: 2px; }

    /* ── Misc ── */
    .text-muted { color: var(--muted); }
    .text-danger { color: var(--danger); }
    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    .info-box { padding: 10px 14px; border-radius: 6px; font-size: 12.5px; line-height: 1.6; border-left: 3px solid; }
    .info-box.success { background: #0c1f14; border-color: var(--success); color: #86efac; }
    .info-box.error   { background: #1f0d0d; border-color: var(--danger);  color: #fca5a5; }
    .info-box.info    { background: #0d1430; border-color: var(--accent);   color: #93c5fd; }
    .color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,0.2); }
  </style>
</head>
<body>
<div id="app">
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>

<div id="modal-backdrop">
  <div id="modal-box">
    <div id="modal-header">
      <span id="modal-title">Modal</span>
      <button class="modal-close" onclick="closeModal()">&#215;</button>
    </div>
    <div id="modal-body"></div>
    <div id="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" id="modal-save-btn">Simpan</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
// ── CONSTANTS ──────────────────────────────────────────────────────────────
const KEYS = {
  vehicles:        'vms_vehicles',
  drivers:         'vms_drivers',
  driverLicenses:  'vms_driver_licenses',
  vehicleLicenses: 'vms_vehicle_licenses',
  geofences:       'vms_geofences',
  trips:           'vms_trips',
  fuelLogs:        'vms_fuel_logs',
  maintenance:     'vms_maintenance',
  spareParts:      'vms_spare_parts',
};

// ── UTILS ──────────────────────────────────────────────────────────────────
const uuid    = () => crypto.randomUUID();
const esc     = s => { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; };
const fmt     = (n, d = 1) => Number(n || 0).toFixed(d);
const fmtNum  = n => Number(n || 0).toLocaleString('id-ID');
const fmtCur  = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';

function daysUntil(dateStr) {
  if (!dateStr) return null;
  return Math.ceil((new Date(dateStr) - new Date()) / 86400000);
}

function expiryBadge(dateStr) {
  const d = daysUntil(dateStr);
  if (d === null) return '<span class="badge badge-muted">-</span>';
  if (d < 0)    return `<span class="badge badge-danger">Expired ${Math.abs(d)}h lalu</span>`;
  if (d <= 30)  return `<span class="badge badge-warning">${d} hari lagi</span>`;
  return `<span class="badge badge-success">${fmtDate(dateStr)}</span>`;
}

// ── DATA LAYER ─────────────────────────────────────────────────────────────
const db       = key  => JSON.parse(localStorage.getItem(key) || '[]');
const dbSave   = (key, data) => localStorage.setItem(key, JSON.stringify(data));
const dbGet    = (key, id)   => db(key).find(r => r.id === id);
const dbAdd    = (key, rec)  => { const d = db(key); d.push({ id: uuid(), createdAt: new Date().toISOString(), ...rec }); dbSave(key, d); };
const dbUpdate = (key, id, u) => dbSave(key, db(key).map(r => r.id === id ? { ...r, ...u, updatedAt: new Date().toISOString() } : r));
const dbDelete = (key, id)   => dbSave(key, db(key).filter(r => r.id !== id));

// ── TOAST ──────────────────────────────────────────────────────────────────
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── MODAL ──────────────────────────────────────────────────────────────────
let _modalSave = null;

function showModal(title, bodyHtml, onSave, saveLabel = 'Simpan') {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-save-btn').textContent = saveLabel;
  _modalSave = onSave;
  document.getElementById('modal-backdrop').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');
  _modalSave = null;
}

// ── ICONS ──────────────────────────────────────────────────────────────────
const IC = {
  vehicle:  `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M5 17H3a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2l2-4h14l2 4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/></svg>`,
  driver:   `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`,
  idcard:   `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="12" r="2"/><path d="M14 10h4M14 14h3"/></svg>`,
  document: `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>`,
  mappin:   `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>`,
  grid:     `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>`,
  map:      `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><polygon points="3,6 9,3 15,6 21,3 21,18 15,21 9,18 3,21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>`,
  route:    `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M3 17l3-9 4 4 3-6 4 8 4-4"/></svg>`,
  droplet:  `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>`,
  chart:    `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="4" width="4" height="17"/></svg>`,
  wrench:   `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`,
  package:  `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27,6.96 12,12.01 20.73,6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`,
  plus:     `<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,

function exportData() {
  const data = { _exportedAt: new Date().toISOString(), _version: '1' };
  Object.entries(KEYS).forEach(([key, lsKey]) => { data[key] = db(lsKey); });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: `vms-backup-${new Date().toISOString().slice(0,10)}.json` });

function importData() {
  const input  = Object.assign(document.createElement('input'), { type: 'file', accept: '.json' });
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        let count = 0;
        Object.entries(KEYS).forEach(([key, lsKey]) => {
          if (Array.isArray(data[key])) { dbSave(lsKey, data[key]); count++; }
        });
        toast(`Import berhasil — ${count} tabel data dipulihkan`);
        navigate(currentPage);
      } catch { toast('File tidak valid atau rusak', 'error'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ── LEAFLET LOADER ─────────────────────────────────────────────────────────
let _leafletReady = false;
let _leafletQueue = [];

function loadLeaflet() {
  return new Promise((resolve, reject) => {
    if (_leafletReady) { resolve(); return; }
    _leafletQueue.push({ resolve, reject });
    if (_leafletQueue.length > 1) return;
    const sources = [
      'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',
      'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
      'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
    ];
    let i = 0;
    function tryNext() {
      if (i >= sources.length) {
        _leafletQueue.forEach(cb => cb.reject(new Error('Leaflet CDN gagal')));
        _leafletQueue = [];
        return;
      }
      const s = document.createElement('script');
      s.src = sources[i++];
      s.onload = () => {
        if (typeof L !== 'undefined') {
          _leafletReady = true;
          _leafletQueue.forEach(cb => cb.resolve());
          _leafletQueue = [];
        } else tryNext();
      };
      s.onerror = tryNext;
      document.head.appendChild(s);
    }
    tryNext();
  });
}

// ── GEO HELPERS ────────────────────────────────────────────────────────────
function haversine(a, b) {
  const R = 6371, r = d => d * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
  const x = Math.sin(dLat/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

function getSpeedColor(s) {
  if (s <= 0) return '#ef4444';
  if (s < 10) return '#f97316';
  if (s < 20) return '#f59e0b';
  if (s < 35) return '#84cc16';
  return '#22c55e';
}

function buildSpeedTrack(points) {
  const hasSpeed = points.some(p => p.speed > 0);
  if (!hasSpeed) return L.polyline(points.map(p => [p.lat, p.lon]), { color: '#4f7af8', weight: 4, opacity: 0.85 });
  const layers = []; let segStart = 0;
  for (let i = 0; i < points.length - 1; i++) {
    const cc = getSpeedColor(points[i].speed);
    const nc = i + 1 < points.length - 1 ? getSpeedColor(points[i + 1].speed) : null;
    if (nc !== cc) {
      layers.push(L.polyline(points.slice(segStart, i + 2).map(p => [p.lat, p.lon]), { color: cc, weight: 5, opacity: 0.9 }));
      segStart = i + 1;
    }
  }
  if (segStart < points.length - 1)
    layers.push(L.polyline(points.slice(segStart).map(p => [p.lat, p.lon]), { color: getSpeedColor(points[segStart].speed), weight: 5, opacity: 0.9 }));
  return L.featureGroup(layers);
}

function computeStats(points) {
  let dist = 0, maxSpd = 0, sumSpd = 0, spdCnt = 0, elevGain = 0, elevLoss = 0;
  for (let i = 1; i < points.length; i++) {
    dist += haversine(points[i-1], points[i]);
    if (points[i].speed > 0) { maxSpd = Math.max(maxSpd, points[i].speed); sumSpd += points[i].speed; spdCnt++; }
    const de = points[i].ele - points[i-1].ele;
    if (de > 0) elevGain += de; else elevLoss -= de;
  }
  const first = points[0].time ? new Date(points[0].time) : null;
  const last  = points[points.length-1].time ? new Date(points[points.length-1].time) : null;
  let duration = '-';
  if (first && last) { const ms = last - first; duration = `${String(Math.floor(ms/60000)).padStart(2,'0')}:${String(Math.floor((ms%60000)/1000)).padStart(2,'0')}`; }
  return { distanceKm: dist, maxSpeed: maxSpd, avgSpeed: spdCnt ? sumSpd/spdCnt : 0, elevGain: Math.round(elevGain), elevLoss: Math.round(elevLoss), duration };
}

function parseGPX(xmlText) {
  const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
  if (xml.querySelector('parsererror')) throw new Error('GPX tidak valid');
  const trkpts = xml.querySelectorAll('trkpt');
  if (!trkpts.length) throw new Error('Tidak ada trackpoint di file GPX');
  const points = [];
  trkpts.forEach(pt => {
    const lat = parseFloat(pt.getAttribute('lat')), lon = parseFloat(pt.getAttribute('lon'));
    if (!isNaN(lat) && !isNaN(lon)) points.push({
      lat, lon,
      ele: parseFloat(pt.querySelector('ele')?.textContent || '0'),
      time: pt.querySelector('time')?.textContent || null,
      speed: parseFloat(pt.querySelector('speed')?.textContent || '0') * 3.6,
    });
  });
  const name = xml.querySelector('trk > name')?.textContent || 'Track';
  return { points, name, format: 'GPX' };
}

function parseKML(xmlText) {
  const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
  if (xml.querySelector('parsererror')) throw new Error('KML tidak valid');
  const coordsEl = xml.querySelector('LineString > coordinates') || xml.querySelector('coordinates');
  if (!coordsEl) throw new Error('Tidak ada koordinat LineString di file KML');
  const points = coordsEl.textContent.trim().split(/\s+/).map(t => {
    const [lon, lat, ele] = t.split(',').map(parseFloat);
    return { lat, lon, ele: ele || 0, time: null, speed: 0 };
  }).filter(p => !isNaN(p.lat) && !isNaN(p.lon));
  if (!points.length) throw new Error('Tidak ada koordinat valid');
  const name = xml.querySelector('Placemark > name')?.textContent || 'Track';
  return { points, name, format: 'KML' };
}

function pointInPolygon(point, polygon) {
  const x = point.lon, y = point.lat; let inside = false;
  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
    const xi = polygon[i][1], yi = polygon[i][0], xj = polygon[j][1], yj = polygon[j][0];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi + 1e-10) + xi)) inside = !inside;
  }
  return inside;
}

function pageGeofences(el) {
  let gfMap = null, gfMarkers = [], gfDrawPoints = [], gfDrawLayer = null, gfDrawing = false;
  const gfRuntimeLayers = {};

  function renderPanel() {
    const geofences = db(KEYS.geofences);
    const listHtml = geofences.length === 0
      ? `<div class="empty-state" style="padding:20px 0"><p>Belum ada geofence tersimpan</p></div>`
      : geofences.map(g => `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
          <span class="color-dot" style="background:${esc(g.color)};flex-shrink:0"></span>
          <span style="flex:1;font-size:13px">${esc(g.name)}</span>
          <span class="text-muted" style="font-size:11px">${g.latlngs.length} titik</span>
          <button class="btn btn-ghost btn-sm" onclick="gfZoom('${g.id}')" title="Zoom">${IC.eye}</button>
          <button class="btn btn-ghost btn-sm text-danger" onclick="gfDelete('${g.id}')" title="Hapus">${IC.trash}</button>
        </div>`).join('');

    el.innerHTML = `
      <div class="tracking-panel" style="width:360px">
        <div style="padding:4px 0 12px">
          <div style="font-size:16px;font-weight:600">Geofence Library</div>
          <div class="text-muted" style="font-size:12px;margin-top:2px">Kelola area geofence</div>
        </div>

        <div class="panel-section">
          <div class="panel-section-title">Buat Geofence Baru</div>
          <div class="form-grid" style="gap:8px">
            <div class="form-group">
              <label>Nama</label>
              <input id="gf-name" placeholder="cth: Rumah, Kantor">
            </div>
            <div style="display:flex;gap:8px;align-items:flex-end">
              <div class="form-group" style="flex:1">
                <label>Warna</label>
                <input type="color" id="gf-color" value="#10b981" style="height:36px;padding:3px 6px;cursor:pointer">
              </div>
              <button class="btn btn-primary" id="gf-draw-btn" onclick="gfStartDraw()" style="height:36px">Mulai Gambar</button>
              <button class="btn btn-danger" id="gf-cancel-btn" onclick="gfCancelDraw()" style="height:36px;display:none">Batal</button>
            </div>
            <div id="gf-hint" class="info-box info" style="display:none;font-size:12px">
              Klik peta untuk tambah titik &bull; Double-click untuk selesai (min. 3 titik)
            </div>
          </div>
        </div>

        <div class="panel-section" style="flex:1;overflow-y:auto">
          <div class="panel-section-title">Tersimpan (${geofences.length})</div>
          ${listHtml}
        </div>
      </div>
      <div id="gf-map" style="flex:1"></div>`;

    if (!gfMap) {
      loadLeaflet().then(() => {
        gfMap = L.map('gf-map').setView([-6.2, 106.9], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(gfMap);
        db(KEYS.geofences).forEach(g => addGfLayer(g));
        setupGfMapEvents();
      }).catch(e => {
        document.getElementById('gf-map').innerHTML = `<div style="padding:24px;color:var(--danger)">Gagal load peta: ${e.message}</div>`;
      });
    } else {
      db(KEYS.geofences).forEach(g => { if (!gfRuntimeLayers[g.id]) addGfLayer(g); });
    }
  }

  function addGfLayer(g) {
    const layer = L.polygon(g.latlngs, { color: g.color, fillColor: g.color, fillOpacity: 0.18, weight: 2 })
      .addTo(gfMap).bindPopup(`<b>${g.name}</b>`);
    gfRuntimeLayers[g.id] = layer;
  }

  function setupGfMapEvents() {
    gfMap.on('click', e => {
      if (!gfDrawing) return;
      gfDrawPoints.push([e.latlng.lat, e.latlng.lng]);
      const m = L.circleMarker(e.latlng, { radius: 5, color: '#fff', fillColor: '#4f7af8', fillOpacity: 1, weight: 2 }).addTo(gfMap);
      gfMarkers.push(m);
      if (gfDrawLayer) gfMap.removeLayer(gfDrawLayer);
      if (gfDrawPoints.length >= 2) {
        const col = document.getElementById('gf-color').value;
        gfDrawLayer = L.polyline(gfDrawPoints, { color: col, weight: 3, dashArray: '6,4' }).addTo(gfMap);
      }
    });
    gfMap.on('dblclick', e => {
      if (!gfDrawing) return;
      e.originalEvent.preventDefault();
      if (gfDrawPoints.length < 3) { toast('Minimal 3 titik untuk polygon', 'error'); return; }
      gfFinalizePolygon();
    });
  }

  window.gfStartDraw = function() {
    const name = document.getElementById('gf-name').value.trim();
    if (!name) { toast('Isi nama geofence dulu', 'error'); return; }
    gfDrawing = true; gfDrawPoints = []; gfMarkers = [];
    gfMap.getContainer().style.cursor = 'crosshair';
    gfMap.doubleClickZoom.disable();
    document.getElementById('gf-draw-btn').style.display = 'none';
    document.getElementById('gf-cancel-btn').style.display = '';
    document.getElementById('gf-hint').style.display = '';
  };

  window.gfCancelDraw = function() {
    gfDrawing = false; gfDrawPoints = [];
    gfMarkers.forEach(m => gfMap.removeLayer(m)); gfMarkers = [];
    if (gfDrawLayer) { gfMap.removeLayer(gfDrawLayer); gfDrawLayer = null; }
    gfMap.getContainer().style.cursor = '';
    gfMap.doubleClickZoom.enable();
    document.getElementById('gf-draw-btn').style.display = '';
    document.getElementById('gf-cancel-btn').style.display = 'none';
    document.getElementById('gf-hint').style.display = 'none';
  };

  function gfFinalizePolygon() {
    const name  = document.getElementById('gf-name').value.trim();
    const color = document.getElementById('gf-color').value;
    const rec = { name, color, latlngs: gfDrawPoints.slice() };
    dbAdd(KEYS.geofences, rec);
    gfMarkers.forEach(m => gfMap.removeLayer(m));
    if (gfDrawLayer) gfMap.removeLayer(gfDrawLayer);
    gfDrawLayer = null; gfMarkers = [];
    gfDrawing = false;
    gfMap.getContainer().style.cursor = '';
    gfMap.doubleClickZoom.enable();
    toast('Geofence disimpan');
    renderPanel();
    const saved = db(KEYS.geofences);
    const last = saved[saved.length - 1];
    if (last) addGfLayer(last);
  }

  window.gfZoom = function(id) {
    const layer = gfRuntimeLayers[id];
    if (layer) gfMap.fitBounds(layer.getBounds(), { padding: [40, 40] });
  };

  window.gfDelete = function(id) {
    const g = dbGet(KEYS.geofences, id);
    if (!confirm(`Hapus geofence "${g ? g.name : id}"?`)) return;
    if (gfRuntimeLayers[id]) { gfMap.removeLayer(gfRuntimeLayers[id]); delete gfRuntimeLayers[id]; }
    dbDelete(KEYS.geofences, id); toast('Geofence dihapus', 'error'); renderPanel();
  };

  renderPanel();
}

        <div id="tr-time" class="text-muted" style="font-size:11px;margin-top:2px">-</div>
        <div id="tr-legend" style="display:none;margin-top:10px">
          <div class="text-muted" style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:4px">Kecepatan</div>
          <div class="speed-legend">
            <span class="speed-swatch" style="background:#ef4444">Stop</span>
            <span class="speed-swatch" style="background:#f97316">&lt;10</span>
            <span class="speed-swatch" style="background:#f59e0b">&lt;20</span>
            <span class="speed-swatch" style="background:#84cc16">&lt;35</span>
            <span class="speed-swatch" style="background:#22c55e">35+</span>
            <span class="text-muted" style="font-size:10px">km/h</span>
          </div>
        </div>
      </div>

      <div id="tr-gf-section" class="panel-section" style="display:none">
        <div class="panel-section-title">Geofence Events (<span id="tr-gf-count">0</span>)</div>
        <div id="tr-gf-list" style="max-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:4px"></div>
      </div>

      <div style="margin-top:auto;padding-top:12px">
        <button class="btn btn-primary" style="width:100%;display:none" id="tr-save-btn">Simpan Trip</button>
      </div>
    </div>
    <div id="tracking-map"></div>`;

  loadLeaflet().then(() => {
    tMap = L.map('tracking-map').setView([-6.2, 106.9], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(tMap);
    db(KEYS.geofences).forEach(g => {
      L.polygon(g.latlngs, { color: g.color, fillColor: g.color, fillOpacity: 0.15, weight: 2 })
        .addTo(tMap).bindPopup(`<b>${g.name}</b>`);
    });
    if (window._pendingTripId) {
      const trip = dbGet(KEYS.trips, window._pendingTripId);
      window._pendingTripId = null;
      if (trip) { renderTrack(trip); document.getElementById('tr-save-btn').style.display = 'none'; }
    }
  }).catch(e => {
    document.getElementById('tracking-map').innerHTML = `<div style="padding:24px;color:var(--danger)">Gagal load peta: ${e.message}</div>`;
  });

  function showInfo(msg, type) {
    const el2 = document.getElementById('tr-info');
    el2.className = `info-box ${type}`;
    el2.textContent = msg;
    el2.style.display = '';
  }

  function renderTrack(parsed) {
    const { points, name, format } = parsed;
    tPoints = points; tCurrentTrack = { ...parsed, stats: computeStats(points) };
    if (tTrackLayer) tMap.removeLayer(tTrackLayer);
    if (tStartM) tMap.removeLayer(tStartM);
    if (tEndM) tMap.removeLayer(tEndM);
    tTrackLayer = buildSpeedTrack(points).addTo(tMap);
    const ll = points.map(p => [p.lat, p.lon]);
    tStartM = L.marker(ll[0]).addTo(tMap).bindPopup('<b>Titik Awal</b>');
    tEndM   = L.marker(ll[ll.length-1]).addTo(tMap).bindPopup('<b>Titik Akhir</b>');
    tMap.fitBounds(tTrackLayer.getBounds(), { padding: [40, 40] });
    const s = tCurrentTrack.stats;
    document.getElementById('tr-dist').innerHTML   = s.distanceKm.toFixed(2) + '<span class="stat-unit">km</span>';
    document.getElementById('tr-dur').textContent  = s.duration;
    document.getElementById('tr-maxspd').innerHTML = s.maxSpeed.toFixed(1) + '<span class="stat-unit">km/h</span>';
    document.getElementById('tr-avgspd').innerHTML = s.avgSpeed.toFixed(1) + '<span class="stat-unit">km/h</span>';
    document.getElementById('tr-elev').innerHTML   = s.elevGain + '/' + s.elevLoss + '<span class="stat-unit">m</span>';
    document.getElementById('tr-pts').textContent  = points.length;
    document.getElementById('tr-stats-panel').style.display  = '';
    document.getElementById('tr-playback-panel').style.display = '';
    document.getElementById('tr-legend').style.display = points.some(p => p.speed > 0) ? '' : 'none';
    const slider = document.getElementById('tr-slider');
    slider.max = points.length - 1; slider.value = 0;
    updateMarker(0);
    document.getElementById('tr-save-btn').style.display = '';
    if (format === 'KML') showInfo('KML tidak memiliki data waktu & kecepatan per titik.', 'info');
    else showInfo('Berhasil dimuat. ' + points.length + ' titik.', 'success');
    renderGfEvents();
  }

  function updateMarker(idx) {
    if (!tPoints.length) return;
    const p = tPoints[idx];
    if (tPlayM) tMap.removeLayer(tPlayM);
    tPlayM = L.marker([p.lat, p.lon], {
      icon: L.divIcon({ className: '', html: '<div style="font-size:20px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))">&#x1F6F5;</div>', iconSize: [26,26], iconAnchor: [13,13] }),
      zIndexOffset: 1000
    }).addTo(tMap);
    document.getElementById('tr-idx').textContent  = `${idx+1}/${tPoints.length}`;
    document.getElementById('tr-spd').textContent  = p.speed > 0 ? p.speed.toFixed(1) + ' km/h' : '-';
    document.getElementById('tr-time').textContent = p.time ? new Date(p.time).toLocaleString('id-ID') : '-';
  }

  function renderGfEvents() {
    const geofences = db(KEYS.geofences);
    const sec = document.getElementById('tr-gf-section');
    if (!geofences.length || !tPoints.length) { sec.style.display = 'none'; return; }
    const events = [];
    geofences.forEach(g => {
      let wasIn = false;
      tPoints.forEach((p, i) => {
        const isIn = pointInPolygon(p, g.latlngs);
        if (isIn && !wasIn) { wasIn = true; events.push({ type: 'enter', name: g.name, color: g.color, idx: i, time: p.time }); }
        else if (!isIn && wasIn) { wasIn = false; events.push({ type: 'exit', name: g.name, color: g.color, idx: i, time: p.time }); }
      });
    });
    events.sort((a,b) => a.idx - b.idx);
    document.getElementById('tr-gf-count').textContent = events.length;
    document.getElementById('tr-gf-list').innerHTML = events.slice(0, 20).map(ev => `
      <div style="font-size:11.5px;padding:4px 6px;background:var(--bg);border-radius:4px;border-left:2px solid ${ev.color};cursor:pointer"
           onclick="document.getElementById('tr-slider').value=${ev.idx};updateTrMarker(${ev.idx})">
        <span style="color:var(--text)">${ev.type === 'enter' ? 'Masuk' : 'Keluar'}</span>
        <span class="text-muted"> — ${esc(ev.name)}</span>
      </div>`).join('');
    sec.style.display = '';
  }

  window.updateTrMarker = idx => updateMarker(parseInt(idx));

  document.getElementById('tr-file').addEventListener('change', e => {
    if (!e.target.files[0]) return;
    const f = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const ext = f.name.split('.').pop().toLowerCase();
        if (ext === 'gpx') renderTrack(parseGPX(ev.target.result));
        else if (ext === 'kml') renderTrack(parseKML(ev.target.result));
        else throw new Error('Format tidak didukung. Gunakan .gpx atau .kml');
      } catch(err) { showInfo(err.message, 'error'); }
    };
    reader.readAsText(f);
  });

  const uploadBox = document.getElementById('tr-upload-box');
  uploadBox.addEventListener('dragover', e => { e.preventDefault(); uploadBox.classList.add('dragover'); });
  uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('dragover'));
  uploadBox.addEventListener('drop', e => {
    e.preventDefault(); uploadBox.classList.remove('dragover');
    if (e.dataTransfer.files[0]) {
      const f = e.dataTransfer.files[0];
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const ext = f.name.split('.').pop().toLowerCase();
          if (ext === 'gpx') renderTrack(parseGPX(ev.target.result));
          else if (ext === 'kml') renderTrack(parseKML(ev.target.result));
          else throw new Error('Format tidak didukung');
        } catch(err) { showInfo(err.message, 'error'); }
      };
      reader.readAsText(f);
    }
  });

  document.getElementById('tr-slider').addEventListener('input', e => updateMarker(parseInt(e.target.value)));

  document.getElementById('tr-play-btn').addEventListener('click', () => {
    if (tPlayInterval) {
      clearInterval(tPlayInterval); tPlayInterval = null;
      document.getElementById('tr-play-btn').textContent = 'Play';
    } else {
      document.getElementById('tr-play-btn').textContent = 'Pause';
      tPlayInterval = setInterval(() => {
        const s = document.getElementById('tr-slider');
        const idx = parseInt(s.value);
        if (idx >= tPoints.length - 1) { clearInterval(tPlayInterval); tPlayInterval = null; document.getElementById('tr-play-btn').textContent = 'Play'; return; }
        s.value = idx + 1; updateMarker(idx + 1);
      }, 80);
    }
  });

  document.getElementById('tr-reset-btn').addEventListener('click', () => {
    if (tPlayInterval) { clearInterval(tPlayInterval); tPlayInterval = null; document.getElementById('tr-play-btn').textContent = 'Play'; }
    document.getElementById('tr-slider').value = 0; updateMarker(0);
  });

  document.getElementById('tr-save-btn').addEventListener('click', () => {
    if (!tCurrentTrack) return;
    const vehicles = db(KEYS.vehicles);
    const drivers  = db(KEYS.drivers);
    const vehOpts  = vehicles.map(v => `<option value="${v.id}">${esc(v.plate)} — ${esc(v.brand)} ${esc(v.model)}</option>`).join('');
    const drvOpts  = drivers.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('');
    const defDate  = tCurrentTrack.points[0]?.time ? tCurrentTrack.points[0].time.slice(0, 10) : new Date().toISOString().slice(0, 10);
    showModal('Simpan Trip', `<div class="form-grid">
      <div class="form-group"><label>Nama Trip</label><input id="tsf-name" value="${esc(tCurrentTrack.name)}"></div>
      <div class="form-group"><label>Tanggal</label><input id="tsf-date" type="date" value="${defDate}"></div>
      <div class="form-group"><label>Kendaraan</label><select id="tsf-veh"><option value="">-- Tidak dipilih --</option>${vehOpts}</select></div>
      <div class="form-group"><label>Driver</label><select id="tsf-drv"><option value="">-- Tidak dipilih --</option>${drvOpts}</select></div>
      <div class="form-group"><label>Catatan</label><textarea id="tsf-notes" placeholder="Opsional"></textarea></div>
    </div>`, () => {
      const name = document.getElementById('tsf-name').value.trim();
      if (!name) { toast('Nama trip wajib diisi', 'error'); return; }
      dbAdd(KEYS.trips, {
        name,
        date: document.getElementById('tsf-date').value,
        vehicleId: document.getElementById('tsf-veh').value || null,
        driverId: document.getElementById('tsf-drv').value || null,
        notes: document.getElementById('tsf-notes').value.trim(),
        format: tCurrentTrack.format,
        stats: tCurrentTrack.stats,
        points: tCurrentTrack.points,
        savedAt: new Date().toISOString(),
      });
      closeModal(); toast('Trip disimpan');
      document.getElementById('tr-save-btn').style.display = 'none';
    });
  });
}

function pageFuelReport(el) {
  const fuelTs     = l => new Date((l.date || '') + 'T' + (l.time || '00:00'));
  const fuelDtLbl  = l => fmtDate(l.date) + (l.time ? ' ' + l.time : '');

  function render(vehicleId, periodIdx) {
    const vehicles    = db(KEYS.vehicles);
    const vehOpts     = vehicles.map(v => `<option value="${v.id}"${vehicleId===v.id?' selected':''}>${esc(v.plate)} — ${esc(v.brand)} ${esc(v.model)}</option>`).join('');
    const veh         = vehicleId ? vehicles.find(v => v.id === vehicleId) : null;
    const theoretical = veh?.theoreticalConsumption ? Number(veh.theoreticalConsumption) : null;

    let chartHtml = '', summaryHtml = '', diagHtml = '', periodHtml = '';

    if (vehicleId) {
      const logs = db(KEYS.fuelLogs)
        .filter(l => l.vehicleId === vehicleId && l.odometer != null && l.liters > 0)
        .sort((a, b) => fuelTs(a) - fuelTs(b));

      // Build all intervals with period labels
      const allIntervals = [];
      for (let i = 1; i < logs.length; i++) {
        const km  = Number(logs[i].odometer) - Number(logs[i-1].odometer);
        const lit = Number(logs[i].liters);
        if (km > 0 && lit > 0) allIntervals.push({
          periodLabel:   `${fuelDtLbl(logs[i-1])} → ${fuelDtLbl(logs[i])}`,
          label:         fuelDtLbl(logs[i]),
          actual:        km / lit,
          km, lit,
          pricePerLiter: logs[i].pricePerLiter ? Number(logs[i].pricePerLiter) : null,
        });
      }

      // Open interval: last fill-up → last recorded trip after it
      if (logs.length > 0) {
        const lastLog    = logs[logs.length - 1];
        const lastTs     = fuelTs(lastLog);
        const lastDate   = lastLog.date || '';
        const tripsAfter = db(KEYS.trips)
          .filter(t => t.vehicleId === vehicleId && (t.date || '') >= lastDate);
        const kmSince  = tripsAfter.reduce((s, t) => s + (t.stats?.distanceKm || 0), 0);
        const lastTrip = [...tripsAfter].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
        const endLabel = lastTrip ? fmtDate(lastTrip.date) : 'Sekarang';
        allIntervals.push({
          isOpen: true,
          periodLabel: `${fuelDtLbl(lastLog)} → ${endLabel} ↻`,
          label: endLabel,
          actual: null, km: kmSince, lit: null,
          litTheo: theoretical && kmSince > 0 ? kmSince / theoretical : null,
          pricePerLiter: lastLog.pricePerLiter ? Number(lastLog.pricePerLiter) : null,
        });
      }

      // Period filter dropdown
      const closedIntervals = allIntervals.filter(x => !x.isOpen);
      if (allIntervals.length >= 1) {
        const pIdx = (periodIdx !== undefined && periodIdx !== null && periodIdx !== '') ? parseInt(periodIdx) : -1;
        const periodOpts = allIntervals.map((iv, i) =>
          `<option value="${i}"${pIdx === i ? ' selected' : ''}>${esc(iv.periodLabel)}</option>`
        ).join('');
        periodHtml = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:24px;flex-wrap:wrap">
          <label style="color:var(--muted);font-size:12px;white-space:nowrap">Periode:</label>
          <select onchange="renderFuelReport('${vehicleId}', this.value)" style="max-width:380px">
            <option value=""${pIdx === -1 ? ' selected' : ''}>Semua Periode Tertutup (${closedIntervals.length} interval)</option>
            ${periodOpts}
          </select>
        </div>`;
      }

      // Apply period filter — "Semua" only aggregates closed intervals
      const pIdx2 = (periodIdx !== undefined && periodIdx !== null && periodIdx !== '') ? parseInt(periodIdx) : -1;
      const selInterval = pIdx2 >= 0 ? allIntervals[pIdx2] : null;
      const intervals   = selInterval ? [selInterval] : closedIntervals;

      // Diagnostic info when data is missing
      const allLogs = db(KEYS.fuelLogs).filter(l => l.vehicleId === vehicleId);
      const noOdo   = allLogs.filter(l => l.odometer == null || l.odometer === '');
      if (allLogs.length === 0) {
        diagHtml = `<div class="info-box info">Belum ada Fuel Log untuk kendaraan ini. Tambahkan minimal 2 entri dengan <strong>odometer</strong> dan <strong>jam</strong> diisi.</div>`;
      } else if (closedIntervals.length === 0) {
        diagHtml = `<div class="info-box info">
          Ditemukan <strong>${allLogs.length}</strong> entri fuel log, tapi butuh minimal <strong>2 entri dengan odometer terisi</strong> untuk hitung interval konsumsi.
          ${noOdo.length > 0 ? `<br>${noOdo.length} entri tidak punya odometer — edit entri tersebut untuk melengkapi.` : ''}
        </div>`;
      }

      // ---- OPEN INTERVAL selected ----
      if (selInterval?.isOpen) {
        const iv = selInterval;
        const estLit  = iv.litTheo;
        const estCost = estLit && iv.pricePerLiter ? estLit * iv.pricePerLiter : null;
        summaryHtml = `
          <div class="info-box info" style="margin-bottom:20px">
            <strong>Periode Berlangsung</strong> — Pengisian berikutnya belum tercatat.
            Data aktual km/L tidak dapat dihitung. Berikut estimasi berdasarkan konsumsi teoritis.
          </div>
          <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:24px">
            <div class="kpi-card" style="border-left:3px solid var(--accent)">
              <div class="kpi-label">Km Tercatat</div>
              <div class="kpi-value">${iv.km > 0 ? fmtNum(Math.round(iv.km)) : '0'}<span style="font-size:13px;color:var(--muted)"> km</span></div>
              <div class="kpi-sub">dari Trip Log sejak pengisian</div>
            </div>
            <div class="kpi-card" style="border-left:3px solid #a78bfa">
              <div class="kpi-label">Estimasi BBM Terpakai</div>
              <div class="kpi-value">${estLit ? estLit.toFixed(2) + '<span style="font-size:13px;color:var(--muted)"> L</span>' : '-'}</div>
              <div class="kpi-sub">${theoretical ? 'Berdasarkan teoritis ' + theoretical + ' km/L' : 'Isi teoritis di master Vehicle'}</div>
            </div>
            <div class="kpi-card" style="border-left:3px solid var(--warning)">
              <div class="kpi-label">Estimasi Biaya BBM</div>
              <div class="kpi-value" style="font-size:20px;padding-top:4px">${estCost ? fmtCur(Math.round(estCost)) : '-'}</div>
              <div class="kpi-sub">${iv.pricePerLiter ? 'Harga: ' + fmtCur(iv.pricePerLiter) + '/L (pengisian terakhir)' : 'Isi harga/L di Fuel Log'}</div>
            </div>
          </div>`;
        chartHtml = `<div class="card" style="text-align:center;padding:32px;color:var(--muted);font-size:13px">
          Chart km/L tersedia setelah pengisian BBM berikutnya dicatat
        </div>`;
      }

      // ---- CLOSED INTERVAL(S) ----
      else if (intervals.length > 0) {
        const avgActual     = intervals.reduce((s, x) => s + x.actual, 0) / intervals.length;
        const totalKm       = intervals.reduce((s, x) => s + x.km, 0);
        const totalLitActual = intervals.reduce((s, x) => s + x.lit, 0);

        const totalLitTheo  = theoretical ? totalKm / theoretical : null;
        const litDiff       = totalLitTheo !== null ? totalLitTheo - totalLitActual : null;

        const pricedLogs    = intervals.filter(x => x.pricePerLiter > 0);
        const avgPrice      = pricedLogs.length > 0
          ? pricedLogs.reduce((s, x) => s + x.pricePerLiter, 0) / pricedLogs.length : null;
        const costDiff      = litDiff !== null && avgPrice ? litDiff * avgPrice : null;

        const diff          = theoretical ? avgActual - theoretical : null;
        const diffBadge = diff !== null
          ? `<span class="badge ${diff >= 0 ? 'badge-success' : 'badge-warning'}">${diff >= 0 ? '+' : ''}${diff.toFixed(1)} km/L</span>`
          : '<span class="badge badge-muted">Isi teoritis di master Vehicle</span>';

        const litBadge = litDiff !== null
          ? `<span class="badge ${litDiff >= 0 ? 'badge-success' : 'badge-warning'}">${litDiff >= 0 ? 'Hemat' : 'Boros'} ${Math.abs(litDiff).toFixed(2)} L</span>`
          : '<span class="badge badge-muted">-</span>';

        const costBadge = costDiff !== null
          ? `<span class="badge ${costDiff >= 0 ? 'badge-success' : 'badge-warning'}">${costDiff >= 0 ? 'Hemat' : 'Boros'} ${fmtCur(Math.abs(Math.round(costDiff)))}</span>`
          : avgPrice ? '<span class="badge badge-muted">-</span>' : '<span class="badge badge-muted">Isi harga/L di Fuel Log</span>';

        summaryHtml = `
          <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">
            <div class="kpi-card">
              <div class="kpi-label">Rata2 Aktual</div>
              <div class="kpi-value">${avgActual.toFixed(2)}<span style="font-size:13px;color:var(--muted)"> km/L</span></div>
              <div class="kpi-sub">${intervals.length} interval pengisian</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Teoritis (Spec)</div>
              <div class="kpi-value">${theoretical ? theoretical.toFixed(1) + '<span style="font-size:13px;color:var(--muted)"> km/L</span>' : '-'}</div>
              <div class="kpi-sub">dari master Vehicle</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Selisih Efisiensi</div>
              <div class="kpi-value" style="font-size:18px;padding-top:4px">${diffBadge}</div>
            </div>
          </div>
          <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:24px">
            <div class="kpi-card">
              <div class="kpi-label">Total Jarak</div>
              <div class="kpi-value">${fmtNum(Math.round(totalKm))}<span style="font-size:13px;color:var(--muted)"> km</span></div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Hemat / Boros (Liter)</div>
              <div class="kpi-value" style="font-size:18px;padding-top:4px">${litBadge}</div>
              <div class="kpi-sub">${totalLitTheo ? 'Teoritis: ' + totalLitTheo.toFixed(2) + ' L · Aktual: ' + totalLitActual.toFixed(2) + ' L' : ''}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Hemat / Boros (Rupiah)</div>
              <div class="kpi-value" style="font-size:18px;padding-top:4px">${costBadge}</div>
              <div class="kpi-sub">${avgPrice ? 'Avg harga: ' + fmtCur(Math.round(avgPrice)) + '/L' : 'Isi harga/L di Fuel Log'}</div>
            </div>
          </div>`;

        // Chart
        const maxVal = Math.max(...intervals.map(x => x.actual), theoretical || 0) * 1.25;
        const H = 160, W_bar = 36, GAP = 14;
        const totalW = Math.max(300, intervals.length * (W_bar + GAP) + GAP);
        const barHtml = intervals.map((iv, i) => {
          const bH    = Math.max(4, (iv.actual / maxVal) * H);
          const x     = GAP + i * (W_bar + GAP);
          const color = theoretical && iv.actual >= theoretical * 0.9 ? '#22c55e' : '#f59e0b';
          return `<rect x="${x}" y="${H - bH}" width="${W_bar}" height="${bH}" fill="${color}" rx="3" opacity="0.85"/>
            <text x="${x + W_bar/2}" y="${H - bH - 5}" text-anchor="middle" font-size="10" fill="#c0c4d0" font-weight="500">${iv.actual.toFixed(1)}</text>
            <text x="${x + W_bar/2}" y="${H + 15}" text-anchor="middle" font-size="9" fill="#7b8099">${iv.label.slice(0,6)}</text>
            <text x="${x + W_bar/2}" y="${H + 25}" text-anchor="middle" font-size="8" fill="#555870">${iv.km.toFixed(0)}km</text>`;
        }).join('');

        const theoLineY = theoretical ? H - (theoretical / maxVal) * H : null;
        const theoLine  = theoLineY !== null
          ? `<line x1="0" y1="${theoLineY}" x2="${totalW}" y2="${theoLineY}" stroke="#4f7af8" stroke-width="1.5" stroke-dasharray="6,4"/>
             <text x="4" y="${theoLineY - 5}" font-size="9" fill="#4f7af8">${theoretical} km/L (spec)</text>`
          : '';

        // When viewing "Semua", append open period info card below chart
        const openIv = allIntervals.find(x => x.isOpen);
        const openCard = (!selInterval && openIv) ? `
          <div class="card" style="margin-top:16px;border-left:3px solid var(--accent);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
            <div>
              <div style="font-size:11px;color:var(--muted);margin-bottom:3px">Periode Berlangsung (belum tutup)</div>
              <div style="font-size:13px;font-weight:500">${esc(openIv.periodLabel)}</div>
            </div>
            <div style="display:flex;gap:20px;flex-wrap:wrap">
              <div><div style="font-size:11px;color:var(--muted)">Km tercatat</div><div style="font-weight:600">${openIv.km > 0 ? fmtNum(Math.round(openIv.km)) + ' km' : '0 km'}</div></div>
              <div><div style="font-size:11px;color:var(--muted)">Est. BBM</div><div style="font-weight:600">${openIv.litTheo ? openIv.litTheo.toFixed(2) + ' L' : '-'}</div></div>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="renderFuelReport('${vehicleId}', '${allIntervals.length - 1}')">Lihat Detail</button>
          </div>` : '';

        chartHtml = `<div class="card" style="overflow-x:auto">
          <div class="section-title" style="margin-bottom:16px">Konsumsi per Interval Pengisian (km/L)</div>
          <svg width="${totalW}" height="${H + 34}" style="display:block;min-width:100%">
            ${barHtml}${theoLine}
          </svg>
          <div class="chart-legend" style="margin-top:12px">
            <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>Efisien (≥ 90% teoritis)</div>
            <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>Di bawah teoritis</div>
            ${theoretical ? `<div class="legend-item"><div style="width:16px;height:2px;background:#4f7af8;border-radius:1px"></div>Target teoritis</div>` : ''}
          </div>
        </div>${openCard}`;
      }
    } else {
      chartHtml = `<div class="empty-state"><p>Pilih kendaraan untuk melihat laporan konsumsi BBM.</p></div>`;
    }

    el.innerHTML = `<div class="page">
      <div class="page-header">
        <div><div class="page-title">Fuel Report</div><div class="page-sub">Analisis konsumsi BBM aktual vs teoritis</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:${periodHtml ? '16px' : '24px'};flex-wrap:wrap">
        <label style="color:var(--muted);font-size:12px;white-space:nowrap">Kendaraan:</label>
        <select onchange="renderFuelReport(this.value, null)" style="max-width:280px">
          <option value="">-- Pilih Kendaraan --</option>${vehOpts}
        </select>
      </div>
      ${periodHtml}
      ${diagHtml ? `<div style="margin-bottom:20px">${diagHtml}</div>` : ''}
      ${summaryHtml}
      ${chartHtml}
    </div>`;
  }

  window.renderFuelReport = (id, pidx) => render(id, pidx);
  render();
}
function pageMaintenance(el) {
  const TYPES = [
    'Ganti Oli', 'Ganti Filter Oli', 'Ganti Filter Udara', 'Ganti Busi',
    'Tune Up', 'Servis Berkala', 'Ganti Rantai', 'Ganti Gear Set',
    'Ganti Kampas Rem Depan', 'Ganti Kampas Rem Belakang',
    'Ganti Ban Depan', 'Ganti Ban Belakang', 'Ganti Aki', 'Lainnya',
  ];
  const SVC = {
    'Ganti Oli':                  { days: 90,   km: 3000  },
    'Ganti Filter Oli':           { days: 180,  km: 6000  },
    'Ganti Filter Udara':         { days: 180,  km: 10000 },
    'Ganti Busi':                 { days: null, km: 8000  },
    'Tune Up':                    { days: 180,  km: 8000  },
    'Servis Berkala':             { days: 90,   km: 3000  },
    'Ganti Rantai':               { days: null, km: 10000 },
    'Ganti Gear Set':             { days: null, km: 20000 },
    'Ganti Kampas Rem Depan':     { days: null, km: 15000 },
    'Ganti Kampas Rem Belakang':  { days: null, km: 10000 },
    'Ganti Ban Depan':            { days: 730,  km: 20000 },
    'Ganti Ban Belakang':         { days: 730,  km: 15000 },
    'Ganti Aki':                  { days: 730,  km: null  },
  };

  window.maintAutoSuggest = function() {
    const checked = [...document.querySelectorAll('.maint-type-cb:checked')].map(cb => cb.value);
    const date    = document.getElementById('mf-date').value;
    const odo     = parseInt(document.getElementById('mf-odo').value) || null;
    let minDays = Infinity, minKm = Infinity;
    checked.forEach(t => {
      if (SVC[t]?.days) minDays = Math.min(minDays, SVC[t].days);
      if (SVC[t]?.km)   minKm   = Math.min(minKm,   SVC[t].km);
    });
    if (date && minDays < Infinity) {
      const d = new Date(date + 'T00:00'); d.setDate(d.getDate() + minDays);
      document.getElementById('mf-ndate').value = d.toISOString().slice(0, 10);
    }
    if (odo && minKm < Infinity) {
      document.getElementById('mf-nodo').value = odo + minKm;
    }
  };

  function render() {
    const logs     = [...db(KEYS.maintenance)].sort((a, b) => new Date(b.date) - new Date(a.date));
    const vehicles = db(KEYS.vehicles);

    const tbody = logs.length === 0
      ? `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:24px">Belum ada catatan maintenance.</td></tr>`
      : logs.map(m => {
          const veh   = vehicles.find(v => v.id === m.vehicleId);
          const types = Array.isArray(m.types) ? m.types : (m.type ? [m.type] : []);
          let nextBadge = '-';
          if (m.nextDueDate) nextBadge = expiryBadge(m.nextDueDate);
          else if (m.nextDueOdometer) nextBadge = `<span class="badge badge-muted">${fmtNum(m.nextDueOdometer)} km</span>`;
          return `<tr>
            <td>${fmtDate(m.date)}</td>
            <td>${esc(veh ? veh.plate : '-')}</td>
            <td><div style="display:flex;flex-wrap:wrap;gap:3px">${types.map(t => `<span class="badge badge-accent">${esc(t)}</span>`).join('')}</div></td>
            <td>${esc(m.description || '-')}</td>
            <td>${m.odometer ? fmtNum(m.odometer) + ' km' : '-'}</td>
            <td>${m.cost ? fmtCur(m.cost) : '-'}</td>
            <td>${nextBadge}</td>
            <td><div class="td-actions">
              <button class="btn btn-ghost btn-sm" onclick="openMaintForm('${m.id}')">${IC.edit}</button>
              <button class="btn btn-ghost btn-sm text-danger" onclick="deleteMaint('${m.id}')">${IC.trash}</button>
            </div></td>
          </tr>`;
        }).join('');

    el.innerHTML = `<div class="page">
      <div class="page-header">
        <div><div class="page-title">Maintenance Log</div><div class="page-sub">Riwayat servis dan perawatan kendaraan</div></div>
        <button class="btn btn-primary" onclick="openMaintForm()">${IC.plus} Tambah</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Tanggal</th><th>Kendaraan</th><th>Jenis Servis</th><th>Keterangan</th><th>Odometer</th><th>Biaya</th><th>Next Due</th><th></th></tr></thead>
        <tbody>${tbody}</tbody>
      </table></div>
    </div>`;
  }

  window.openMaintForm = function(id) {
    const m        = id ? dbGet(KEYS.maintenance, id) : {};
    const vehicles = db(KEYS.vehicles);
    const vehOpts  = vehicles.map(v => `<option value="${v.id}"${m.vehicleId===v.id?' selected':''}>${esc(v.plate)} — ${esc(v.brand)} ${esc(v.model)}</option>`).join('');
    const selTypes = Array.isArray(m.types) ? m.types : (m.type ? [m.type] : []);
    const typePills = TYPES.map(t => {
      const sel = selTypes.includes(t);
      return `<label style="display:flex;align-items:center;gap:5px;padding:5px 10px;background:var(--card);border:1px solid ${sel ? 'var(--accent)' : 'var(--border)'};border-radius:20px;cursor:pointer;font-size:12px">
        <input type="checkbox" class="maint-type-cb" value="${t}" ${sel ? 'checked' : ''} onchange="maintAutoSuggest()" style="accent-color:var(--accent)">
        ${esc(t)}
      </label>`;
    }).join('');

    showModal(id ? 'Edit Maintenance' : 'Tambah Maintenance', `<div class="form-grid">
      <div class="form-group">
        <label>Kendaraan</label>
        <select id="mf-veh"><option value="">-- Pilih Kendaraan --</option>${vehOpts}</select>
      </div>
      <div class="form-group">
        <label>Tanggal</label>
        <input id="mf-date" type="date" value="${m.date || new Date().toISOString().slice(0,10)}" onchange="maintAutoSuggest()">
      </div>
      <div class="form-group">
        <label>Jenis Servis <span style="color:var(--muted);font-size:11px">— boleh pilih lebih dari satu</span></label>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${typePills}</div>
      </div>
      <div class="form-group"><label>Keterangan</label><input id="mf-desc" value="${esc(m.description||'')}" placeholder="cth: Shell Helix HX7 10W-40, AHASS"></div>
      <div class="form-group"><label>Bengkel</label><input id="mf-ws" value="${esc(m.workshop||'')}" placeholder="AHASS Honda, Bengkel Resmi"></div>
      <div class="form-grid form-grid-2">
        <div class="form-group"><label>Odometer (km)</label><input id="mf-odo" type="number" value="${m.odometer||''}" placeholder="12500" onchange="maintAutoSuggest()"></div>
        <div class="form-group"><label>Biaya (Rp)</label><input id="mf-cost" type="number" value="${m.cost||''}" placeholder="150000"></div>
      </div>
      <div class="form-grid form-grid-2">
        <div class="form-group">
          <label>Next Due Tanggal <span style="color:var(--accent);font-size:11px">(auto-suggest)</span></label>
          <input id="mf-ndate" type="date" value="${m.nextDueDate||''}">
        </div>
        <div class="form-group">
          <label>Next Due Odometer (km) <span style="color:var(--accent);font-size:11px">(auto-suggest)</span></label>
          <input id="mf-nodo" type="number" value="${m.nextDueOdometer||''}" placeholder="—">
        </div>
      </div>
    </div>`, () => {
      const vehicleId = document.getElementById('mf-veh').value;
      if (!vehicleId) { toast('Pilih kendaraan terlebih dahulu', 'error'); return; }
      const types = [...document.querySelectorAll('.maint-type-cb:checked')].map(cb => cb.value);
      if (!types.length) { toast('Pilih minimal satu jenis servis', 'error'); return; }
      const rec = {
        vehicleId,
        date:            document.getElementById('mf-date').value,
        types,
        description:     document.getElementById('mf-desc').value.trim(),
        workshop:        document.getElementById('mf-ws').value.trim(),
        odometer:        parseInt(document.getElementById('mf-odo').value) || null,
        cost:            parseInt(document.getElementById('mf-cost').value) || null,
        nextDueDate:     document.getElementById('mf-ndate').value || null,
        nextDueOdometer: parseInt(document.getElementById('mf-nodo').value) || null,
      };
      if (id) dbUpdate(KEYS.maintenance, id, rec); else dbAdd(KEYS.maintenance, rec);
      closeModal(); toast(id ? 'Maintenance diperbarui' : 'Maintenance dicatat'); render();
    });
  };

  window.deleteMaint = function(id) {
    if (!confirm('Hapus catatan maintenance ini?')) return;
    dbDelete(KEYS.maintenance, id); toast('Maintenance dihapus', 'error'); render();
  };

  render();
}

function pageSpareparts(el) {
  const SUGGESTIONS = [
    'Kampas Rem Depan','Kampas Rem Belakang','Ban Depan','Ban Belakang',
    'Rantai','Sprocket Depan','Sprocket Belakang','Gear Set',
    'Oli Mesin','Filter Oli','Filter Udara','Busi','Aki',
    'Bearing Roda Depan','Bearing Roda Belakang','Sokbreker Depan','Sokbreker Belakang',
    'Kopling','Kabel Gas','Kabel Rem','Lampu Depan','Lampu Belakang',
  ];
  const PART_KM = {
    'Kampas Rem Depan': 15000,'Kampas Rem Belakang': 10000,
    'Ban Depan': 20000,'Ban Belakang': 15000,
    'Rantai': 10000,'Sprocket Depan': 25000,'Sprocket Belakang': 15000,'Gear Set': 15000,
    'Oli Mesin': 3000,'Filter Oli': 6000,'Filter Udara': 10000,'Busi': 8000,
    'Bearing Roda Depan': 30000,'Bearing Roda Belakang': 30000,
  };
  const PART_DAYS = {
    'Ban Depan': 730,'Ban Belakang': 730,'Aki': 730,
    'Oli Mesin': 90,'Filter Oli': 180,'Filter Udara': 180,
  };

  function estOdometer(vehicleId) {
    const logs = db(KEYS.fuelLogs).filter(l => l.vehicleId === vehicleId && l.odometer);
    return logs.length ? Math.max(...logs.map(l => Number(l.odometer))) : null;
  }

  window.partAutoSuggest = function() {
    const partName = document.getElementById('sp-name').value;
    const date     = document.getElementById('sp-date').value;
    const odo      = parseInt(document.getElementById('sp-odo').value) || null;
    if (date && PART_DAYS[partName]) {
      const d = new Date(date + 'T00:00'); d.setDate(d.getDate() + PART_DAYS[partName]);
      document.getElementById('sp-ndate').value = d.toISOString().slice(0, 10);
    }
    if (odo && PART_KM[partName]) {
      document.getElementById('sp-nodo').value = odo + PART_KM[partName];
    }
  };

  function render() {
    const parts    = [...db(KEYS.spareParts)].sort((a, b) => new Date(b.replacedDate) - new Date(a.replacedDate));
    const vehicles = db(KEYS.vehicles);

    const tbody = parts.length === 0
      ? `<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:24px">Belum ada catatan spare part.</td></tr>`
      : parts.map(p => {
          const veh      = vehicles.find(v => v.id === p.vehicleId);
          const currOdo  = estOdometer(p.vehicleId);
          const kmUsed   = (currOdo && p.odometerAt) ? currOdo - Number(p.odometerAt) : null;
          const nextKm   = p.nextDueOdometer ? Number(p.nextDueOdometer) : null;
          const kmLeft   = (nextKm && currOdo) ? nextKm - currOdo : null;

          let nextBadge  = '-', statusBadge = '';
          if (p.nextDueDate) {
            nextBadge = expiryBadge(p.nextDueDate);
            const d = daysUntil(p.nextDueDate);
            statusBadge = d < 0 ? `<span class="badge badge-danger">Ganti!</span>` :
                          d <= 30 ? `<span class="badge badge-warning">Segera</span>` :
                          `<span class="badge badge-success">OK</span>`;
          } else if (nextKm && currOdo !== null) {
            nextBadge = `<span class="badge badge-muted">${fmtNum(nextKm)} km</span>`;
            statusBadge = kmLeft <= 0 ? `<span class="badge badge-danger">Ganti!</span>` :
                          kmLeft <= 500 ? `<span class="badge badge-warning">Segera</span>` :
                          `<span class="badge badge-success">OK</span>`;
          } else if (nextKm) {
            nextBadge = `<span class="badge badge-muted">${fmtNum(nextKm)} km</span>`;
          }

          return `<tr>
            <td><strong>${esc(p.partName)}</strong></td>
            <td>${esc(veh ? veh.plate : '-')}</td>
            <td><span class="badge ${p.category === 'wearable' ? 'badge-warning' : 'badge-muted'}">${p.category === 'wearable' ? 'Wearable' : 'Permanen'}</span></td>
            <td>${fmtDate(p.replacedDate)}</td>
            <td>${p.odometerAt ? fmtNum(p.odometerAt) + ' km' : '-'}</td>
            <td>${kmUsed !== null ? fmtNum(Math.round(kmUsed)) + ' km' : '-'}</td>
            <td>${p.brand ? esc(p.brand) : '-'}</td>
            <td>${p.cost ? fmtCur(p.cost) : '-'}</td>
            <td>${nextBadge}</td>
            <td>${statusBadge || '-'}</td>
            <td><div class="td-actions">
              <button class="btn btn-ghost btn-sm" onclick="openPartForm('${p.id}')">${IC.edit}</button>
              <button class="btn btn-ghost btn-sm text-danger" onclick="deletePart('${p.id}')">${IC.trash}</button>
            </div></td>
          </tr>`;
        }).join('');

    el.innerHTML = `<div class="page">
      <div class="page-header">
        <div><div class="page-title">Spare Parts</div><div class="page-sub">Monitoring penggantian komponen &amp; lifetime tracking</div></div>
        <button class="btn btn-primary" onclick="openPartForm()">${IC.plus} Tambah</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Komponen</th><th>Kendaraan</th><th>Tipe</th><th>Diganti</th><th>Odo Ganti</th><th>Pemakaian</th><th>Merek</th><th>Biaya</th><th>Next Due</th><th>Status</th><th></th></tr></thead>
        <tbody>${tbody}</tbody>
      </table></div>
    </div>`;
  }

  window.openPartForm = function(id) {
    const p        = id ? dbGet(KEYS.spareParts, id) : {};
    const vehicles = db(KEYS.vehicles);
    const vehOpts  = vehicles.map(v => `<option value="${v.id}"${p.vehicleId===v.id?' selected':''}>${esc(v.plate)} — ${esc(v.brand)} ${esc(v.model)}</option>`).join('');
    const suggList = SUGGESTIONS.map(s => `<option value="${s}">`).join('');

    showModal(id ? 'Edit Spare Part' : 'Tambah Spare Part', `
      <datalist id="part-suggestions">${suggList}</datalist>
      <div class="form-grid">
        <div class="form-group">
          <label>Kendaraan</label>
          <select id="sp-veh"><option value="">-- Pilih Kendaraan --</option>${vehOpts}</select>
        </div>
        <div class="form-grid form-grid-2">
          <div class="form-group">
            <label>Nama Komponen</label>
            <input id="sp-name" list="part-suggestions" value="${esc(p.partName||'')}" placeholder="Kampas Rem Depan" oninput="partAutoSuggest()">
          </div>
          <div class="form-group">
            <label>Tipe</label>
            <select id="sp-cat">
              <option value="wearable"${(!p.category || p.category==='wearable') ? ' selected' : ''}>Wearable (rutin ganti)</option>
              <option value="non-wearable"${p.category==='non-wearable' ? ' selected' : ''}>Permanen (ganti kalau rusak)</option>
            </select>
          </div>
        </div>
        <div class="form-grid form-grid-2">
          <div class="form-group">
            <label>Tanggal Diganti</label>
            <input id="sp-date" type="date" value="${p.replacedDate || new Date().toISOString().slice(0,10)}" onchange="partAutoSuggest()">
          </div>
          <div class="form-group">
            <label>Odometer Saat Ganti (km)</label>
            <input id="sp-odo" type="number" value="${p.odometerAt||''}" placeholder="12500" onchange="partAutoSuggest()">
          </div>
        </div>
        <div class="form-grid form-grid-2">
          <div class="form-group"><label>Merek</label><input id="sp-brand" value="${esc(p.brand||'')}" placeholder="Federal, NGK, Bosch..."></div>
          <div class="form-group"><label>Biaya (Rp)</label><input id="sp-cost" type="number" value="${p.cost||''}" placeholder="150000"></div>
        </div>
        <div class="form-grid form-grid-2">
          <div class="form-group">
            <label>Next Due Tanggal <span style="color:var(--accent);font-size:11px">(auto-suggest)</span></label>
            <input id="sp-ndate" type="date" value="${p.nextDueDate||''}">
          </div>
          <div class="form-group">
            <label>Next Due Odometer (km) <span style="color:var(--accent);font-size:11px">(auto-suggest)</span></label>
            <input id="sp-nodo" type="number" value="${p.nextDueOdometer||''}" placeholder="—">
          </div>
        </div>
        <div class="form-group"><label>Catatan</label><textarea id="sp-notes">${esc(p.notes||'')}</textarea></div>
      </div>`, () => {
      const vehicleId = document.getElementById('sp-veh').value;
      const partName  = document.getElementById('sp-name').value.trim();
      if (!vehicleId) { toast('Pilih kendaraan', 'error'); return; }
      if (!partName)  { toast('Isi nama komponen', 'error'); return; }
      const rec = {
        vehicleId, partName,
        category:        document.getElementById('sp-cat').value,
        brand:           document.getElementById('sp-brand').value.trim(),
        replacedDate:    document.getElementById('sp-date').value,
        odometerAt:      parseInt(document.getElementById('sp-odo').value) || null,
        nextDueDate:     document.getElementById('sp-ndate').value || null,
        nextDueOdometer: parseInt(document.getElementById('sp-nodo').value) || null,
        cost:            parseInt(document.getElementById('sp-cost').value) || null,
        notes:           document.getElementById('sp-notes').value.trim(),
      };
      if (id) dbUpdate(KEYS.spareParts, id, rec); else dbAdd(KEYS.spareParts, rec);
      closeModal(); toast(id ? 'Spare part diperbarui' : 'Spare part dicatat'); render();
    });
  };

  window.deletePart = function(id) {
    if (!confirm('Hapus catatan spare part ini?')) return;
    dbDelete(KEYS.spareParts, id); toast('Spare part dihapus', 'error'); render();
  };

  render();
}

// ── INIT ───────────────────────────────────────────────────────────────────
function init() {
  buildSidebar();
  document.getElementById('modal-save-btn').addEventListener('click', () => { if (_modalSave) _modalSave(); });
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
